spring.application.name=core-service

# Replace this development fallback with a random secret of at least 32 bytes in production.
app.jwt.secret=${JWT_SECRET:local-development-secret-change-before-deploy}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mowm_db?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root@user1}

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=2222

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
